  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const templateData = JSON.parse(templateEl.textContent);
    const pages = templateData.pages;
    const entryId = templateData.entry;
    const pageIds = Object.keys(pages);

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {

            const ds = new DecompressionStream('gzip');

            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

    // file:// document inherit a null origin, so crossorigin forces a CORS
    // fetch that SRI then rejects — the manifest bytes are ours; SRI protects
    // against CDN compromise, not this), and inject the page's own
    // window.__resources + the click interceptor into <head>. slice() rather
    // than replace() keeps us clear of $-pattern substitution.

      }

      // a blanket <base target="_parent"> would also redirect form submissions
      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from
      // an in-page hash router are left to the scroll path so they don't yank
      // the user to the entry page); plain #frag scrolls in place.

      // anchors, which closest()/IDL .target get wrong.

            'var tg = a.getAttribute("target");' +
            'if (tg && tg !== "_self") return;' +

            'if (h.charAt(0) !== "#") {' +

              'e.preventDefault();' +

              'return;' +
            '}' +
            'e.preventDefault();' +
            'if (h.slice(0, 2) === "#/") {' +
              'var c = h.indexOf(":", 2);' +
              'var pid = c < 0 ? h.slice(2) : h.slice(2, c);' +
              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +
            '}' +
            'var t = h.length > 1 ? document.getElementById(h.slice(1)) : null;' +
            'if (t) t.scrollIntoView({behavior:"smooth"});' +
            'else scrollTo({top:0, behavior:"smooth"});' +
          '});' : '');

      // ids) before wrapping — same escape level as every sibling JSON island.
      var headScript = '<script>' +
        headContent.split('</' + 'script').join('<\\/' + 'script') +
        '</' + 'script>';
      // Inject after <head> so the DOCTYPE stays first; prepending the script
      // would push the parser into quirks mode. DOMParser always emits a <head>
      // (synthesizing one if the source HTML omitted it) but may carry
      // attributes through, so match the full opening tag.

        var hi = headOpen.index + headOpen[0].length;

      }

    }

    setStatus('Rendering...');

    if (pageIds.length === 1) {
      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per
      // spec — re-create each with createElement so they execute, awaiting
      // onload for src scripts to preserve ordering (React before ReactDOM

        const s = document.createElement('script');
        for (const a of old.attributes) s.setAttribute(a.name, a.value);

        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.

          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();

        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.

        if (p) await p;
      }
      // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }
      return;
    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    window.addEventListener('hashchange', navigate);
    navigate();
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

ackground:#0B0D15;padding:22px;display:flex;flex-direction:column;gap:13px\">\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#29D198\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"><\u002Fpath><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:15px;font-weight:600\">You confirm every order<\u002Fdiv>\n        <div style=\"font-size:13px;color:#8A90B5;line-height:1.5\">The agent fills the ticket. Signing and sending is always your move.<\u002Fdiv>\n        <div class=\"mono\" style=\"margin-top:2px;font-size:10px;color:#29D198;background:rgba(41,209,152,0.08);border:1px solid rgba(41,209,152,0.2);border-radius:7px;padding:7px 9px\">☑ Confirm long · 0.25 BTC<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"lift\" style=\"border:1px solid #1E2230;border-radius:14px;background:#0B0D15;padding:22px;display:flex;flex-direction:column;gap:13px\">\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C7CCE6\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M16 7V5a4 4 0 0 0-8 0v2\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size:15px;font-weight:600\">Non-custodial by default<\u002Fdiv>\n        <div style=\"font-size:13px;color:#8A90B5;line-height:1.5\">Your keys, your wallet. Agent.trade never holds your funds.<\u002Fdiv>\n        <div class=\"mono\" style=\"margin-top:2px;font-size:10px;color:#C7CCE6;background:#11141F;border:1px solid #1E2230;border-radius:7px;padding:7px 9px\">0x7a3f…9C21 · self-custody<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"lift\" style=\"border:1px solid #1E2230;border-radius:14px;background:#0B0D15;padding:22px;display:flex;flex-direction:column;gap:13px\">\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\ 02Fdiv>\n                <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#8A90B5;font-family:'PP Neue Montreal'\">Est. liquidation<\u002Fspan><span style=\"color:#F0A23A\">{{ modal.liq }}<\u002Fspan><\u002Fdiv>\n                <div style=\"height:1px;background:#1b2038\"><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#8A90B5;font-family:'PP Neue Montreal'\">Est. fee (taker)<\u002Fspan><span>{{ modal.fee }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#B6BBFF;font-family:'PP Neue Montreal'\">Agent.trade builder fee · 1 bp<\u002Fspan><span style=\"color:#B6BBFF\">{{ modal.builderFee }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:9px;padding:10px 12px;border:1px solid rgba(91,99,255,0.28);background:rgba(91,99,255,0.07);border-radius:9px\">\n                <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#B6BBFF\" stroke-width=\"2\" style=\"flex:none;margin-top:1px\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"><\u002Fline><\u002Fsvg>\n                <span style=\"font-size:11.5px;color:#B6BBFF;line-height:1.5\">Executes on <span style=\"color:#fff\">Hyperliquid<\u002Fspan>. Routed with builder code <span style=\"color:#fff\">Agent.trade active<\u002Fspan> — estimated builder fee 1 bp, shown above. Agent.trade does not custody funds.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:9px;padding:10px 12px;border:1px solid rgba(240,162,58,0.3);background:rgba(240,162,58,0.08);border-radius:9px\">\n                <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F0A23A\" stroke-width=\"2\" style=\"flex:none;margin-top:1px\"><path d=\"M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"><\u002Fpath><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline><\u002Fsvg>\n                <span style=\"font-size:11.5px;color:#E9C892;line-height:1.5\">Leveraged perpetual. Adverse moves can liquidate your position at <span style=\"color:#fff\">{{ modal.liq }}<\u002Fspan>. Only risk what you can afford to lose.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:9px;font-size:12.5px;color:#C7CCE6\">\n                <span onclick=\"{{ modal.toggleAck }}\" style=\"width:18px;height:18px;flex:none;border-radius:5px;border:1px solid; border-color: {{ modal.ackBox.border }};background: {{ modal.ackBox.bg }};cursor:pointer;display:flex;align-items:center;justify-content:center\">\n                  <sc-if value=\"{{ modal.ack }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fsc-if>\n                <\u002Fspan>\n                <span onclick=\"{{ modal.toggleAck }}\" style=\"cursor:pointer\">I understand this is a leveraged perp order.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:9px;margin-top:2px\">\n                <button onclick=\"{{ modal.close }}\" style=\"padding:12px 18px;border:1px solid #2c3258;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;background:#11142B;color:#C7CCE6\">Cancel<\u002Fbutton>\n                <button onclick=\"{{ modal.confirm }}\" style=\"flex:1;padding:12px;border:none;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;background: {{ modal.sideColor }};color:#06140F;opacity: {{ modal.confirmOpacity }};display:flex;align-items:center;justify-content:center;gap:8px\">\n                  <sc-if value=\"{{ modal.confirming }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:14px;height:14px;border:2px solid rgba(6,20,15,0.4);border-top-color:#06140F;border-radius:50%;animation:spin .7s linear infinite\"><\u002Fspan><\u002Fsc-if>\n                  Confirm order\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    loaded: false, route: \"terminal\", tf: \"15m\", chartLoading: false,\n    side: \"long\", orderType: \"market\", sizeUnit: \"BTC\", size: \"\", price: \"\",\n    leverage: 5, marginMode: \"isolated\", reduceOnly: false,\n    tpEnabled: false, slEnabled: false, tp: \"\", sl: \"\", fromAgent: false,\n    bottomTab: \"positions\", bookState: \"ok\", tradesState: \"ok\", tradesErroredOnce: false,\n    agentOpen: true, agentStage: \"rest\", agentScenario: null, proposalDismissed: false,\n    statHi: null, pulseTicket: false, alertSet: false, watching: false,\n    stale: false, dataAge: 1,\n    modalOpen: false, modalAck: false, orderConfirmed: false, confirming: false,\n    now: Date.now(), positions: null,\n  };\n\n  GREEN = \"#26D0A0\"; RED = \"#FF5C6C\"; BLUE = \"#5B63FF\"; AMBER = \"#F0A23A\";\n\n  constructor(props) {\n    super(props);\n    this.chartRef = (el) => {\n      if (el) { this.chartEl = el; this.maybeInitChart(); }\n      else { this.chartEl = null; if (this.chart) { try { this.chart.remove(); } catch (e) {} this.chart = null; } }\n    };\n  }\n\n  componentDidMount() {\n    this.fundingTarget = Date.now() + 1000 * (41 * 60 + 18);\n    import(\"./mockData.js\").then((m) => {\n      this.data = m;\n      this.setState({ loaded: true, positions: m.POSITIONS.map((p) => ({ ...p })) });\n      this.maybeInitChart();\n    });\n    this._poll = setInterval(() => { if (window.LightweightCharts) { clearInterval(this._poll); this.maybeInitChart(); } }, 80);\n    this._tick = setInterval(() => this.setState((s) => {\n      let a = s.dataAge + 1; if (!s.stale && a > 3) a = 0;\n      return { now: Date.now(), dataAge: a };\n    }), 1000);\n  }\n  componentWillUnmount() {\n    clearInterval(this._poll); clearInterval(this._tick);\n    if (this.ro) this.ro.disconnect();\n    if (this.chart) { try { this.chart.remove(); } catch (e) {} }\n  }\n\n  maybeInitChart() {\n    if (this.chart || !this.chartEl || !this.data || !window.LightweightCharts) return;\n    const LC = window.LightweightCharts;\n    this.chart = LC.createChart(this.chartEl, {\n      layout: { background: { color: \"transparent\" }, textColor: \"#8A90B5\", fontFamily: \"JetBrains Mono, monospace\", fontSize: 11 },\n      grid: { vertLines: { color: \"rgba(35,40,70,0.45)\" }, horzLines: { color: \"rgba(35,40,70,0.45)\" } },\n      rightPriceScale: { borderColor: \"#232846\", scaleMargins: { top: 0.08, bottom: 0.26 } },\n      timeScale: { borderColor: \"#232846\", timeVisible: true, secondsVisible: false },\n      crosshair: { mode: 1, vertLine: { color: \"#3a4070\", width: 1, style: 2, labelBackgroundColor: \"#1A1E3D\" }, horzLine: { color: \"#3a4070\", width: 1, style: 2, labelBackgroundColor: \"#1A1E3D\" } },\n    });\n    this.liqPrices = this.liqPrices || [];\n    this.series = this.chart.addCandlestickSeries({\n      upColor: this.GREEN, downColor: this.RED, borderUpColor: this.GREEN, borderDownColor: this.RED, wickUpColor: this.GREEN, wickDownColor: this.RED,\n      autoscaleInfoProvider: (orig) => {\n        const r = orig();\n        if (!r || !this.liqPrices || !this.liqPrices.length) return r;\n        let min = r.priceRange.minValue, max = r.priceRange.maxValue;\n        this.liqPrices.forEach((p) => { min = Math.min(min, p); max = Math.max(max, p); });\n        const pad = (max - min) * 0.04;\n        return { priceRange: { minValue: min - pad, maxValue: max + pad } };\n      },\n    });\n    this.volSeries = this.chart.addHistogramSeries({ priceScaleId: \"vol\", priceFormat: { type: \"volume\" } });\n    this.chart.priceScale(\"vol\").applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });\n    this.applyCandles();\n    this.ro = new ResizeObserver(() => { if (this.chartEl && this.chart) this.chart.applyOptions({ width: this.chartEl.clientWidth, height: this.chartEl.clientHeight }); });\n    this.ro.observe(this.chartEl);\n    if (this._pendingLines) { this.setLiqLines(this._pendingLines); this._pendingLines = null; }\n  }\n  setLiqLines(arr) {\n    this.clearLiqLines();\n    if (!this.series) { this._pendingLines = arr; return; }\n    this.liqLines = arr.map((l) => this.series.createPriceLine({ price: l.price, color: l.color, lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: l.title }));\n    this.liqPrices = arr.map((l) => l.price);\n    this.applyCandles();\n  }\n  clearLiqLines() {\n    if (this.series && this.liqLines) this.liqLines.forEach((l) => { try { this.series.removePriceLine(l); } catch (e) {} });\n    this.liqLines = [];\n    const had = this.liqPrices && this.liqPrices.length;\n    this.liqPrices = [];\n    if (had && this.series) this.applyCandles();\n  }\n  applyCandles() {\n    if (!this.chart || !this.data || !this.chartEl) return;\n    const c = this.data.getCandles(this.state.tf);\n    this.series.setData(c);\n    this.volSeries.setData(c.map((d) => ({ time: d.time, value: Math.abs(d.high - d.low), color: d.close >= d.open ? \"rgba(38,208,160,0.28)\" : \"rgba(255,92,108,0.28)\" })));\n    this.chart.applyOptions({ width: this.chartEl.clientWidth, height: this.chartEl.clientHeight });\n    this.chart.timeScale().fitContent();\n  }\n\n  setTf(tf) {\n    if (tf === this.state.tf) return;\n    this.setState({ tf, chartLoading: true });\n    clearTimeout(this._tfTimer);\n    this._tfTimer = setTimeout(() => { this.applyCandles(); this.setState({ chartLoading: false }); }, 420);\n  }\n  setRoute(route) {\n    this.setState({ route });\n    if (route === \"terminal\") setTimeout(() => this.applyCandles(), 60);\n  }\n  num(v) { const n = parseFloat(v); return isFinite(n) ? n : 0; }\n  sizeInBtc() { const v = this.num(this.state.size); return this.state.sizeUnit === \"USDC\" ? v / this.data.BTC.mark : v; }\n  entryPrice() { return this.state.orderType === \"limit\" && this.num(this.state.price) > 0 ? this.num(this.state.price) : this.data.BTC.mark; }\n  setMax() {\n    if (this.state.sizeUnit === \"USDC\") this.setState({ size: (this.data.ACCOUNT.available * this.state.leverage).toFixed(0) });\n    else this.setState({ size: ((this.data.ACCOUNT.available * this.state.leverage) / this.data.BTC.mark).toFixed(4) });\n  }\n  refreshBook() { this.setState({ bookState: \"loading\" }); setTimeout(() => this.setState({ bookState: \"ok\" }), 650); }\n  refreshTrades() {\n    this.setState({ tradesState: \"loading\" });\n    setTimeout(() => {\n      if (!this.state.tradesErroredOnce) this.setState({ tradesState: \"error\", tradesErroredOnce: true });\n      else this.setState({ tradesState: \"ok\" });\n    }, 650);\n  }\n  retryTrades() { this.setState({ tradesState: \"loading\" }); setTimeout(() => this.setState({ tradesState: \"ok\" }), 650); }\n  closePos(sym) { this.setState((s) => ({ positions: s.positions.filter((p) => p.symbol !== sym) })); }\n\n  runScenario(scn) {\n    if (this.state.agentStage === \"thinking\") return;\n    this.clearLiqLines();\n    this.setState({ agentStage: \"thinking\", agentScenario: scn, statHi: null, proposalDismissed: false, alertSet: false, watching: false });\n    setTimeout(() => {\n      this.setState({ agentStage: \"answered\" });\n      if (scn === \"long\") { this.setState({ statHi: \"long\" }); this.setLiqLines([{ price: 103400, color: \"#F0A23A\", title: \"Liq cluster\" }]); }\n      else if (scn === \"explain\") { this.setState({ statHi: \"long\" }); }\n      else if (scn === \"notrade\") { this.setState({ statHi: \"amber\" }); this.setLiqLines([{ price: 112400, color: \"#FF5C6C\", title: \"Liq risk ↑\" }, { price: 101900, color: \"#FF5C6C\", title: \"Liq risk ↓\" }]); }\n    }, scn === \"explain\" ? 1150 : 1500);\n  }\n  resetAgent() { this.clearLiqLines(); this.setState({ agentStage: \"rest\", agentScenario: null, statHi: null, proposalDismissed: false, alertSet: false, watching: false }); }\n  dismissProposal() { this.clearLiqLines(); this.setState({ proposalDismissed: true, statHi: null }); }\n  setAlert() { this.setState({ alertSet: true }); }\n  watchBtc() { this.setState({ watching: true }); }\n  toggleStale() { this.setState((s) => ({ stale: !s.stale, dataAge: !s.stale ? 42 : 0 })); }\n  sendProposalToTicket() {\n    const p = this.data.AGENT_PROPOSAL;\n    this.setState({ route: \"terminal\", side: \"long\", orderType: \"market\", sizeUnit: \"BTC\", size: String(p.size), leverage: p.leverage, marginMode: p.marginMode, slEnabled: true, sl: String(p.stopLoss), tpEnabled: true, tp: String(p.takeProfit), fromAgent: true, pulseTicket: true });\n    clearTimeout(this._pulseT);\n    this._pulseT = setTimeout(() => this.setState({ pulseTicket: false }), 1400);\n  }\n  reviewOrder() { if (this.sizeInBtc() <= 0) return; this.setState({ modalOpen: true, modalAck: false, orderConfirmed: false, confirming: false }); }\n  closeModal() { this.setState({ modalOpen: false }); }\n  confirmOrder() { if (!this.state.modalAck) return; this.setState({ confirming: true }); setTimeout(() => this.setState({ confirming: false, orderConfirmed: true }), 1100); }\n  estLiq(side, entry, lev) { const mm = 0.006; return side === \"long\" ? entry * (1 - 1 / lev + mm) : entry * (1 + 1 / lev - mm); }\n  fmtCountdown() { let ms = (this.fundingTarget || Date.now()) - this.state.now; if (ms < 0) ms = 0; const m = Math.floor(ms / 60000), sec = Math.floor((ms % 60000) / 1000); return String(m).padStart(2, \"0\") + \":\" + String(sec).padStart(2, \"0\"); }\n\n  renderVals() {\n    const S = this.state;\n    const nav = (id) => () => this.setRoute(id);\n    const navBg = {}, navFg = {};\n    [\"terminal\", \"markets\", \"portfolio\", \"strategy\", \"settings\"].forEach((id) => {\n      const a = S.route === id; navBg[id] = a ? \"#1A1E3D\" : \"transparent\"; navFg[id] = a ? \"#fff\" : \"#9499BC\";\n    });\n    const base = {\n      loaded: S.loaded, route: S.route,\n      isTerminal: S.route === \"terminal\", showPlaceholder: S.route !== \"terminal\",\n      initialLoading: S.route === \"terminal\" && !S.loaded,\n      go: { terminal: nav(\"terminal\"), markets: nav(\"markets\"), portfolio: nav(\"portfolio\"), strategy: nav(\"strategy\"), settings: nav(\"settings\") },\n      navBg, navFg,\n      placeholderTitle: { markets: \"Markets\", portfolio: \"Portfolio\", strategy: \"Strategy Builder\", settings: \"Settings\" }[S.route] || \"\",\n      placeholderDesc: {\n        markets: \"A sortable, searchable board of every Hyperliquid perp — mark, 24h change, volume and funding at a glance.\",\n        portfolio: \"Account equity, margin usage, realized PnL history, and a breakdown of every open position and order.\",\n        strategy: \"Compose multi-leg and conditional strategies, then route the whole basket to Hyperliquid in one confirmation.\",\n        settings: \"Connected wallet, default leverage and margin mode, builder-code routing preferences, and display options.\",\n      }[S.route] || \"\",\n    };\n    if (!this.data) return base;\n\n    const d = this.data, B = d.BTC, A = d.ACCOUNT;\n    const sgn = (n) => (n >= 0 ? \"+\" : \"\");\n    const col = (n) => (n >= 0 ? this.GREEN : this.RED);\n\n    const market = {\n      symbol: B.symbol, mark: d.fmtUsd(B.mark, 1), oracle: d.fmtUsd(B.oracle, 1),\n      changePct: sgn(B.change24hPct) + B.change24hPct.toFixed(2) + \"%\",\n      changeAbs: sgn(B.change24hAbs) + d.fmtUsd(Math.abs
